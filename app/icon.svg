<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f5f2ec; }
    .ink { fill: #16171c; }
    .mid { fill: #5c5a55; }
    .soft { fill: #8a8780; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .ink { fill: #f2efe8; }
      .mid { fill: #a6a39c; }
      .soft { fill: #77746e; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="15"/>
  <rect class="ink" x="10" y="10" width="20" height="20" rx="6.5"/>
  <rect class="mid" x="34" y="10" width="20" height="20" rx="6.5"/>
  <rect class="soft" x="10" y="34" width="20" height="20" rx="6.5"/>
  <rect class="ink" x="34" y="34" width="20" height="20" rx="6.5"/>
</svg>
